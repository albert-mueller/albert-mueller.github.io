name: CI - Build Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Pick up new and edited announcements and discussions from the patcher's
  # GitHub Discussions and refresh the RSS feeds.
  schedule:
    - cron: "23 * * * *"
  # Lets the patcher repo trigger an immediate rebuild whenever an issue,
  # comment, discussion or announcement changes (see
  # .github/workflows/trigger-site-rebuild.yml over there; needs its
  # SITE_DISPATCH_TOKEN secret).
  repository_dispatch:
    types:
      - announcements-updated

# Least privilege: only the deploy job gets Pages/OIDC write access.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    if: github.repository_owner == 'bridgepatcher'
    permissions:
      contents: read
      # Needed so the job token may read (public) GitHub Discussions at all.
      discussions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history so VitePress can read real per-page git timestamps
          # for "Last updated" and the sitemap's <lastmod> entries.
          fetch-depth: 0

      # Automatic takedown: if the site contains known copyrighted artwork
      # (see license-guard.yml), publish a maintenance page instead of the site.
      # The next build after the fix (push or the hourly run) restores it.
      - name: License Guard
        id: guard
        run: |
          python3 -m venv /tmp/lg
          /tmp/lg/bin/pip install --quiet --disable-pip-version-check "pillow==11.3.0"
          REPORT_PATH=/tmp/license-report.md /tmp/lg/bin/python .github/scripts/license_guard.py HEAD

      - name: Setup Node
        if: steps.guard.outputs.violations == '0'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install Dependencies
        if: steps.guard.outputs.violations == '0'
        run: yarn install --frozen-lockfile --ignore-scripts

      # Writes .vitepress/{announcements,discussions,issues}.json and the
      # matching RSS feeds in public/. Announcements = Announcements category,
      # maintainers only; everything else goes to /discussions/.
      # Uses the ANNOUNCEMENTS_TOKEN secret if set (fine-grained PAT with
      # read-only Discussions access to OpenCore-Legacy-Patcher-T2),
      # otherwise the job's own token.
      - name: Fetch announcements from GitHub Discussions
        if: steps.guard.outputs.violations == '0'
        run: node scripts/fetch-announcements.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.ANNOUNCEMENTS_TOKEN || github.token }}
          ANNOUNCEMENTS_CATEGORY: announcements

      - name: Build with VitePress
        if: steps.guard.outputs.violations == '0'
        run: yarn run build

      - name: Maintenance page instead of the site (license violation)
        if: steps.guard.outputs.violations != '0'
        run: |
          mkdir -p .vitepress/dist
          cp .github/maintenance/index.html .vitepress/dist/index.html
          # Every other URL (old deep links) shows the same page.
          cp .github/maintenance/index.html .vitepress/dist/404.html
          {
            echo "## ⛔ Website taken offline"
            echo "License Guard found ${{ steps.guard.outputs.violations }} violation(s), so this build publishes the maintenance page."
            echo "It is replaced by the real site automatically once the violations are fixed on main."
            echo
            cat /tmp/license-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Website replaced by the maintenance page: License Guard found violations."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .vitepress/dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.repository_owner == 'bridgepatcher' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
