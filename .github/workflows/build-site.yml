name: CI - Build Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Pick up new and edited announcements from the patcher's GitHub
  # Discussions (Announcements category) and refresh the RSS feed.
  schedule:
    - cron: "23 * * * *"
  # Lets the patcher repo trigger an immediate rebuild when an announcement
  # is posted (needs a token with access to this repo stored over there).
  repository_dispatch:
    types:
      - announcements-updated

# Least privilege: only the deploy job gets Pages/OIDC write access.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    if: github.repository_owner == 'albert-mueller'
    permissions:
      contents: read
      # Needed so the job token may read (public) GitHub Discussions at all.
      discussions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history so VitePress can read real per-page git timestamps
          # for "Last updated" and the sitemap's <lastmod> entries.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # Writes .vitepress/announcements.json and public/announcements.xml.
      # Uses the ANNOUNCEMENTS_TOKEN secret if set (fine-grained PAT with
      # read-only Discussions access to OpenCore-Legacy-Patcher-T2),
      # otherwise the job's own token.
      - name: Fetch announcements from GitHub Discussions
        run: node scripts/fetch-announcements.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.ANNOUNCEMENTS_TOKEN || github.token }}

      - name: Build with VitePress
        run: yarn run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .vitepress/dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.repository_owner == 'albert-mueller' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
