name: CI - Build Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Pick up new and edited announcements and discussions from the patcher's
  # GitHub Discussions and refresh the RSS feeds.
  schedule:
    - cron: "23 * * * *"
  # Lets the patcher repo trigger an immediate rebuild whenever an issue,
  # comment, discussion or announcement changes (see
  # .github/workflows/trigger-site-rebuild.yml over there; needs its
  # SITE_DISPATCH_TOKEN secret).
  repository_dispatch:
    types:
      - announcements-updated

# Least privilege: only the deploy job gets Pages/OIDC write access.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    if: github.repository_owner == 'bridgepatcher'
    permissions:
      contents: read
      # Needed so the job token may read (public) GitHub Discussions at all.
      discussions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history so VitePress can read real per-page git timestamps
          # for "Last updated" and the sitemap's <lastmod> entries.
          fetch-depth: 0

      # License Guard (same check as .github/workflows/license-guard.yml). Only if it actually
      # FINDS a violation, the real site is NOT built and an "offline" page is published instead,
      # until a later build (push, or the hourly schedule) finds no violations again.
      # If the guard itself fails to run (network, upstream fetch, crash), the normal site is
      # built anyway - the separate License Guard workflow still reports the problem.
      - name: Set up Python (License Guard)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same tools as license-guard.yml, so the site goes offline for exactly the same
      # findings (numpy: artwork inside images, tesseract: Dortania's app name in images).
      - name: Install Pillow, numpy and tesseract
        run: |
          python -m pip install --disable-pip-version-check "pillow==11.3.0" "numpy==2.2.6"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng

      # Shares the per-image OCR/artwork cache with license-guard.yml, so the hourly
      # rebuilds only scan new or changed images.
      - name: Restore artwork/OCR cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/license-guard-art-cache.json
          key: license-guard-art-${{ hashFiles('.github/scripts/license_guard.py') }}-site-${{ github.run_id }}
          restore-keys: |
            license-guard-art-${{ hashFiles('.github/scripts/license_guard.py') }}-

      - name: License Guard
        id: license
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: dortania/OpenCore-Legacy-Patcher
          REPORT_PATH: ${{ runner.temp }}/license-report.md
          ART_CACHE: ${{ runner.temp }}/license-guard-art-cache.json
        run: |
          set -euo pipefail
          BRANCH=$(gh api "repos/$UPSTREAM_REPO" --jq .default_branch)
          git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "+refs/heads/$BRANCH:refs/remotes/upstream/$BRANCH"
          python3 .github/scripts/license_guard.py "upstream/$BRANCH:docs..HEAD" > /dev/null
          V=$(grep -m1 '^violations=' "$GITHUB_OUTPUT" | cut -d= -f2)
          if [ -n "${V:-}" ] && [ "$V" != "0" ]; then
            echo "::error::License Guard found $V violation(s) - publishing the offline page instead of the site."
          fi
          # Single decision used by the steps below: offline only for real findings.
          if [ -n "${V:-}" ] && [ "$V" != "0" ]; then echo "offline=true" >> "$GITHUB_OUTPUT"; else echo "offline=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build offline page (license violations)
        if: steps.license.outputs.offline == 'true'
        run: |
          mkdir -p .vitepress/dist
          cat > .vitepress/dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex">
          <title>BridgePatcher – temporarily offline</title>
          <style>
            :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --link: #0066cc; }
            @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1f; --fg: #f5f5f7; --muted: #a1a1a6; --link: #4da3ff; } }
            body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
                   font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            main { max-width: 36rem; padding: 2rem; }
            h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
            p { margin: .5rem 0; } .de { color: var(--muted); margin-top: 1.5rem; } a { color: var(--link); }
          </style>
          </head>
          <body>
          <main>
            <h1>Temporarily offline</h1>
            <p>This website is offline while we fix a licensing issue. It will be back automatically once the fix is in.</p>
            <p>The patcher itself is still on <a href="https://github.com/bridgepatcher/BridgePatcher">GitHub</a>.</p>
            <div class="de" lang="de">
              <p><strong>Vorübergehend offline.</strong> Die Website ist offline, während wir ein Lizenzproblem beheben.
              Sobald es behoben ist, ist sie automatisch wieder da.</p>
            </div>
          </main>
          </body>
          </html>
          HTML
          cp .vitepress/dist/index.html .vitepress/dist/404.html

      - name: Setup Node
        if: steps.license.outputs.offline != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install Dependencies
        if: steps.license.outputs.offline != 'true'
        run: yarn install --frozen-lockfile --ignore-scripts

      # Writes .vitepress/{announcements,discussions,issues}.json and the
      # matching RSS feeds in public/. Announcements = Announcements category,
      # maintainers only; everything else goes to /discussions/.
      # Uses the ANNOUNCEMENTS_TOKEN secret if set (fine-grained PAT with
      # read-only Discussions access to OpenCore-Legacy-Patcher-T2),
      # otherwise the job's own token.
      - name: Fetch announcements from GitHub Discussions
        if: steps.license.outputs.offline != 'true'
        run: node scripts/fetch-announcements.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.ANNOUNCEMENTS_TOKEN || github.token }}
          ANNOUNCEMENTS_CATEGORY: announcements

      - name: Build with VitePress
        if: steps.license.outputs.offline != 'true'
        run: yarn run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .vitepress/dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.repository_owner == 'bridgepatcher' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
