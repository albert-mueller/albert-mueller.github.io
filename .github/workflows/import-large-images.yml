name: One-time import of large images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-large-images.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download images from OpenCore-Legacy-Patcher-T2 and verify blob hashes
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fsSL -o "images/HD3000-Default-Colors.png" "https://raw.githubusercontent.com/albert-mueller/OpenCore-Legacy-Patcher-T2/main/docs/images/HD3000-Default-Colors.png"
          test "$(git hash-object "images/HD3000-Default-Colors.png")" = "eb97ac50d66577a6f846609f5a332f7528a58b81"
          curl -fsSL -o "images/HD3000-Display-Colors.png" "https://raw.githubusercontent.com/albert-mueller/OpenCore-Legacy-Patcher-T2/main/docs/images/HD3000-Display-Colors.png"
          test "$(git hash-object "images/HD3000-Display-Colors.png")" = "f74ff5369b4422a895c28c73a4d2bb4439ba4c6e"
          curl -fsSL -o "images/OCLP-100-Initial-Support.png" "https://raw.githubusercontent.com/albert-mueller/OpenCore-Legacy-Patcher-T2/main/docs/images/OCLP-100-Initial-Support.png"
          test "$(git hash-object "images/OCLP-100-Initial-Support.png")" = "cd18dfc8ff5e802984abe849b58f39df0bed3c3e"
          curl -fsSL -o "images/OCLP-200-Initial-Support.png" "https://raw.githubusercontent.com/albert-mueller/OpenCore-Legacy-Patcher-T2/main/docs/images/OCLP-200-Initial-Support.png"
          test "$(git hash-object "images/OCLP-200-Initial-Support.png")" = "a7193fa11cd74751d3ebead02f0675c294455fe3"
      - name: Commit images and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/import-large-images.yml
          git add images
          git commit -m "Große Bilder aus OpenCore-Legacy-Patcher-T2/docs übernehmen"
          git push
