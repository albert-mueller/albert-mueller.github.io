<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokaler Übersetzungsfunktionstest - Automatisierte Tests</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .test-title {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }
        .test-result {
            padding: 10px;
            border-radius: 5px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .console-output {
            background-color: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .test-button {
            background-color: #4299e1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: background-color 0.3s;
        }
        .test-button:hover {
            background-color: #3182ce;
        }
        .test-button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4299e1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .summary {
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .summary h3 {
            color: #2d3748;
            margin-top: 0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #4299e1;
        }
        .stat-label {
            font-size: 14px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Automatisierter Test der lokalen Übersetzungsfunktion</h1>
        
        <div class="test-section">
            <div class="test-title">Teststeuerung</div>
            <button id="run-tests" class="test-button">🚀 Alle Tests ausführen</button>
            <button id="run-basic" class="test-button">🔍 Basis-Tests ausführen</button>
            <button id="run-performance" class="test-button">⚡ Leistungstests ausführen</button>
            <button id="clear-console" class="test-button">🗑️ Konsole leeren</button>
            <span id="loading-indicator"></span>
        </div>

        <div class="test-section">
            <div class="test-title">Testzusammenfassung</div>
            <div id="test-summary" class="summary" style="display: none;">
                <h3>Statistik der Testergebnisse</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div id="total-tests" class="stat-number">0</div>
                        <div class="stat-label">Gesamtzahl der Tests</div>
                    </div>
                    <div class="stat-item">
                        <div id="passed-tests" class="stat-number">0</div>
                        <div class="stat-label">Bestanden</div>
                    </div>
                    <div class="stat-item">
                        <div id="failed-tests" class="stat-number">0</div>
                        <div class="stat-label">Fehlgeschlagen</div>
                    </div>
                    <div class="stat-item">
                        <div id="test-duration" class="stat-number">0ms</div>
                        <div class="stat-label">Dauer</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">Echtzeit-Testergebnisse</div>
            <div id="test-results"></div>
        </div>

        <div class="test-section">
            <div class="test-title">Konsolenausgabe</div>
            <div id="console-output" class="console-output">Warte auf Testbeginn...</div>
        </div>
    </div>

    <!-- Lokales Übersetzungsskript laden -->
    <script src="local-translate.js"></script>
    
    <script>
class LocalTranslateTester {
            constructor() {
                this.testResults = [];
                this.consoleOutput = document.getElementById('console-output');
                this.testResultsDiv = document.getElementById('test-results');
                this.loadingIndicator = document.getElementById('loading-indicator');
                this.originalConsoleLog = console.log;
                this.originalConsoleError = console.error;
                this.originalConsoleWarn = console.warn;
                this.setupConsoleCapture();
                this.bindEvents();
            }

            setupConsoleCapture() {
                // Erfasse Konsolenausgabe
                console.log = (...args) => {
                    this.originalConsoleLog.apply(console, args);
                    this.appendConsoleOutput(args.join(' '), 'log');
                };
                
                console.error = (...args) => {
                    this.originalConsoleError.apply(console, args);
                    this.appendConsoleOutput(args.join(' '), 'error');
                };
                
                console.warn = (...args) => {
                    this.originalConsoleWarn.apply(console, args);
                    this.appendConsoleOutput(args.join(' '), 'warn');
                };
            }

            bindEvents() {
                document.getElementById('run-tests').addEventListener('click', () => this.runAllTests());
                document.getElementById('run-basic').addEventListener('click', () => this.runBasicTests());
                document.getElementById('run-performance').addEventListener('click', () => this.runPerformanceTests());
                document.getElementById('clear-console').addEventListener('click', () => this.clearConsole());
            }

            appendConsoleOutput(message, type = 'log') {
                const timestamp = new Date().toLocaleTimeString();
                this.consoleOutput.textContent += `[${timestamp}] ${message}\n`;
                this.consoleOutput.scrollTop = this.consoleOutput.scrollHeight;
            }

            clearConsole() {
                this.consoleOutput.textContent = 'Konsole wurde geleert...\n';
            }

            addTestResult(title, success, message, details = '') {
                const resultDiv = document.createElement('div');
                resultDiv.className = `test-result ${success ? 'success' : 'error'}`;
                resultDiv.innerHTML = `
                    <strong>${success ? '✅' : '❌'} ${title}</strong>
                    ${message ? `<br>${message}` : ''}
                    ${details ? `<br><small style="color: #666;">${details}</small>` : ''}
                `;
                this.testResultsDiv.appendChild(resultDiv);
                this.testResults.push({ title, success, message, details });
}

            async runAllTests() {
                this.testResults = [];
                this.testResultsDiv.innerHTML = '';
                this.loadingIndicator.innerHTML = '<div class="loading"></div>';
                
                const startTime = performance.now();
                
                await this.runBasicTests();
                await this.runPerformanceTests();
                await this.runEdgeCaseTests();
                
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(0);
                
                this.loadingIndicator.innerHTML = '';
                this.updateSummary(duration);
            }

            async runBasicTests() {
                console.log('=== Beginn der Basistests ===');
                
                // Test 1: Existenz des LocalTranslate-Objekts
                try {
                    if (typeof LocalTranslate !== 'undefined') {
                        this.addTestResult('Existenz des LocalTranslate-Objekts', true, 'LocalTranslate-Objekt geladen');
                    } else {
                        this.addTestResult('Existenz des LocalTranslate-Objekts', false, 'LocalTranslate-Objekt nicht definiert');
                    }
                } catch (error) {
                    this.addTestResult('Existenz des LocalTranslate-Objekts', false, error.message);
                }

                // Test 2: Existenz der translate-Methode
                try {
                    if (typeof LocalTranslate.translate === 'function') {
                        this.addTestResult('Existenz der translate-Methode', true, 'translate-Methode verfügbar');
                    } else {
                        this.addTestResult('Existenz der translate-Methode', false, 'translate-Methode nicht verfügbar');
                    }
                } catch (error) {
                    this.addTestResult('Existenz der translate-Methode', false, error.message);
                }

                // Test 3: Einfache Englisch-zu-Chinesisch-Übersetzung
                try {
                    const result = LocalTranslate.translate('hallo', 'de', 'zh');
                    const success = result === '你好';
                    this.addTestResult('Englisch-zu-Chinesisch Übersetzung', success, 
                        success ? `Übersetzungsergebnis: ${result}` : `Erwartet: 你好, Tatsächlich: ${result}`);
                } catch (error) {
                    this.addTestResult('Englisch-zu-Chinesisch Übersetzung', false, error.message);
                }

                // Test 4: Einfache Chinesisch-zu-Englisch-Übersetzung
                try {
                    const result = LocalTranslate.translate('你好', 'zh', 'de');
const success = result === 'hallo';
                    this.addTestResult('Chinesisch nach Deutsch Übersetzung', success, 
                        success ? `Übersetzungsergebnis: ${result}` : `Erwartet: hallo, Tatsächlich: ${result}`);
                } catch (error) {
                    this.addTestResult('Chinesisch nach Deutsch Übersetzung', false, error.message);
                }

                // Test 5: Komplexe Phrase Übersetzung
                try {
                    const result = LocalTranslate.translate('guten morgen', 'de', 'zh');
                    const success = result.includes('早上好');
                    this.addTestResult('Komplexe Phrase Übersetzung', success, 
                        success ? `Übersetzungsergebnis: ${result}` : `Erwartet enthalten: 早上好, Tatsächlich: ${result}`);
                } catch (error) {
                    this.addTestResult('Komplexe Phrase Übersetzung', false, error.message);
                }
            }

            async runPerformanceTests() {
                console.log('=== Leistungstest starten ===');
                
                // Test 1: Einzelübersetzungsleistung
                try {
                    const start = performance.now();
                    const result = LocalTranslate.translate('hallo welt', 'de', 'zh');
                    const end = performance.now();
                    const duration = (end - start).toFixed(2);
                    
                    this.addTestResult('Einzelübersetzungsleistung', true, 
                        `Übersetzungsergebnis: ${result}, Dauer: ${duration}ms`, `Erwartet < 10ms`);
                } catch (error) {
                    this.addTestResult('Einzelübersetzungsleistung', false, error.message);
                }

                // Test 2: Batch-Übersetzungsleistung
                try {
                    const start = performance.now();
                    for (let i = 0; i < 100; i++) {
                        LocalTranslate.translate('hallo', 'de', 'zh');
                    }
                    const end = performance.now();
                    const duration = (end - start).toFixed(2);
                    
                    this.addTestResult('Batch-Übersetzungsleistung', duration < 100, 
                        `100 Übersetzungen Dauer: ${duration}ms`, `Erwartet < 100ms`);
                } catch (error) {
                    this.addTestResult('Batch-Übersetzungsleistung', false, error.message);
                }
            }

            async runEdgeCaseTests() {
                console.log('=== Beginne Randfalltest ===');
                
                // Test 1: Leere Zeichenkette Verarbeitung
                try {
                    const result = LocalTranslate.translate('', 'de', 'zh');
                    const success = result === '';
                    this.addTestResult('Leere Zeichenkette Verarbeitung', success,
success ? 'Richtige Verarbeitung leerer Zeichenkette' : `Ergebnis: "${result}"`);
                } catch (error) {
                    this.addTestResult('Leerer String Verarbeitung', false, error.message);
                }

                // Test 2: Übersetzung gleicher Sprache
                try {
                    const result = LocalTranslate.translate('hallo', 'de', 'de');
                    const success = result === 'hallo';
                    this.addTestResult('Übersetzung gleicher Sprache', success, 
                        success ? 'Richtige Verarbeitung gleicher Sprache' : `Erwartet: hallo, Tatsächlich: ${result}`);
                } catch (error) {
                    this.addTestResult('Übersetzung gleicher Sprache', false, error.message);
                }

                // Test 3: Nicht unterstütztes Sprachpaar
                try {
                    const result = LocalTranslate.translate('hallo', 'de', 'jp');
                    this.addTestResult('Nicht unterstütztes Sprachpaar', false, 
                        `Sollte eine Ausnahme werfen, aber zurückgegeben: ${result}`);
                } catch (error) {
                    this.addTestResult('Nicht unterstütztes Sprachpaar', true, 
                        `Korrekt Ausnahme geworfen: ${error.message}`);
                }
            }

            updateSummary(duration) {
                const total = this.testResults.length;
                const passed = this.testResults.filter(r => r.success).length;
                const failed = total - passed;

                document.getElementById('total-tests').textContent = total;
                document.getElementById('passed-tests').textContent = passed;
                document.getElementById('failed-tests').textContent = failed;
                document.getElementById('test-duration').textContent = duration + 'ms';
                
                const summaryDiv = document.getElementById('test-summary');
                summaryDiv.style.display = 'block';
                
                if (failed === 0) {
                    summaryDiv.className = 'summary';
                    summaryDiv.style.backgroundColor = '#f0fff4';
                    summaryDiv.style.borderColor = '#9ae6b4';
                } else if (failed < total * 0.3) {
                    summaryDiv.className = 'summary';
                    summaryDiv.style.backgroundColor = '#fffff0';
                    summaryDiv.style.borderColor = '#f6e05e';
                } else {
                    summaryDiv.className = 'summary';
                    summaryDiv.style.backgroundColor = '#fff5f5';
                    summaryDiv.style.borderColor = '#fc8181';
                }
            }
        }

        // Initialisiere Tester
        document.addEventListener('DOMContentLoaded', function() {
            new LocalTranslateTester();
});
    </script>
</body>
</html>
